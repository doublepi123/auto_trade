name: CI and Docker Hub

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/auto-trade-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/auto-trade-frontend

jobs:
  backend-test:
    name: Backend Tests (shard ${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Refresh .test_durations when shards drift apart, from backend/:
      #   pytest tests/ -o addopts= -q --no-cov --store-durations
      - name: Run pytest
        env:
          COVERAGE_FILE: .coverage.shard-${{ matrix.group }}
          AUTO_TRADE_TEST_SHARD: ${{ matrix.group }}
          AUTO_TRADE_TEST_SHARD_COUNT: 4
        run: >-
          pytest tests/
          -o addopts=
          -p no:cacheprovider
          -n 4 --dist loadgroup
          --cov=app --cov-config=.coveragerc --cov-report=

      - name: Upload shard coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.group }}
          path: backend/.coverage.shard-${{ matrix.group }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  backend-realtime:
    name: Backend Wall-Clock Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # These spawn their own compute processes and assert elapsed bounds, so
      # they need the whole runner rather than one of four xdist workers.
      - name: Run pytest
        env:
          COVERAGE_FILE: .coverage.shard-realtime
          AUTO_TRADE_TEST_REALTIME_ONLY: '1'
        run: >-
          pytest tests/
          -o addopts=
          -p no:cacheprovider
          -p no:xdist
          --cov=app --cov-config=.coveragerc --cov-report=

      - name: Upload realtime coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-realtime
          path: backend/.coverage.shard-realtime
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  backend-coverage:
    name: Backend Coverage Gate
    needs: [backend-test, backend-realtime]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Install coverage
        run: pip install coverage

      - name: Download shard coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          merge-multiple: true
          path: backend

      # Each shard runs part of the suite, so only the combined data can be
      # measured against the threshold the whole suite used to meet.
      - name: Combine and enforce threshold
        run: |
          coverage combine .coverage.shard-*
          coverage report --rcfile=.coveragerc --show-missing --fail-under=80

  backend-typecheck:
    name: Backend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run basedpyright
        run: basedpyright

  frontend-check:
    name: Frontend Type Check and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./frontend
          start: npm run preview -- --host 0.0.0.0 --port 8080
          wait-on: 'http://localhost:8080'
          wait-on-timeout: 30

  dockerhub:
    name: Build and push Docker images
    needs: [backend-test, backend-realtime, backend-coverage, backend-typecheck, frontend-check, frontend-e2e]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract backend metadata
        id: backend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=tag

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.backend_meta.outputs.tags }}
          labels: ${{ steps.backend_meta.outputs.labels }}

      - name: Extract frontend metadata
        id: frontend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=tag

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend_meta.outputs.tags }}
          labels: ${{ steps.frontend_meta.outputs.labels }}

      - name: Promote matching images to latest
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          previous_backend_digest=$(docker buildx imagetools inspect "${BACKEND_IMAGE}:latest" | awk '$1 == "Digest:" {print $2; exit}' || true)
          docker buildx imagetools create --tag "${BACKEND_IMAGE}:latest" "${BACKEND_IMAGE}:sha-${GITHUB_SHA}"
          if ! docker buildx imagetools create --tag "${FRONTEND_IMAGE}:latest" "${FRONTEND_IMAGE}:sha-${GITHUB_SHA}"; then
            if [ -n "${previous_backend_digest}" ]; then
              docker buildx imagetools create --tag "${BACKEND_IMAGE}:latest" "${BACKEND_IMAGE}@${previous_backend_digest}"
            fi
            exit 1
          fi
