[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
# -n 4, not `auto`: quant-v6 tests spawn their own compute processes and assert
# against wall-clock deadlines, so more workers oversubscribe the CPU and make
# them time out. `auto` measured no faster than 4 (973s vs 1023s). loadgroup
# schedules by the groups conftest assigns: one per module by default, which
# reproduces loadfile, one shared group for the modules that share a database,
# and no group for audited modules so their tests spread across workers.
addopts = -n 4 --dist loadgroup --cov=app --cov-report=term-missing --cov-config=.coveragerc --cov-fail-under=80 --no-cov-on-fail
