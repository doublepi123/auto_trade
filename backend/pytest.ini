[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
# -n 4, not `auto`: quant-v6 tests spawn their own compute processes and assert
# against wall-clock deadlines, so more workers oversubscribe the CPU and make
# them time out. `auto` measured no faster than 4 (973s vs 1023s) because the
# tail is a few long files. loadfile keeps a module's tests on one worker, which
# the modules sharing a fixed temp database rely on.
addopts = -n 4 --dist loadfile --cov=app --cov-report=term-missing --cov-config=.coveragerc --cov-fail-under=80 --no-cov-on-fail
